name: Build JARVIS APK

on:
  push:
    branches: [jarvis-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable JARVIS signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-android-signing-key-v1

      - name: Create stable JARVIS signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=JARVIS Android,O=Mensagem Studio,C=BR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Print signing certificate fingerprint
        run: keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:|Valid from"

      - name: Apply Google TTS dual-voice tuning
        run: python3 scripts/tune_tts.py

      - name: Wire device-control tools
        run: python3 scripts/enable_device_control.py

      - name: Add separate JARVIS and HELENA voice controls
        run: python3 scripts/dual_voice_ui.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and device-control manifest
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -40
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml | grep -E "PermissionSetupActivity|JarvisAccessibilityService|JarvisNotificationListenerService|JarvisVoiceInteractionService|READ_MEDIA_AUDIO|CALL_PHONE|READ_CONTACTS" || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-HELENA-Voice-Agent-v1.6.1-Stable-Signed-Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-HELENA-Voice-Agent-v1.6.1-Stable-Signed-Android16
          path: JARVIS-HELENA-Voice-Agent-v1.6.1-Stable-Signed-Android16.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install and launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global verifier_verify_adb_installs 0 || true
            adb shell settings put global package_verifier_enable 0 || true
            adb install --no-streaming app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.mensagemstudio.jarvis/.PermissionSetupActivity
            adb shell dumpsys package com.mensagemstudio.jarvis | grep -E "versionName|versionCode|targetSdk|minSdk|PermissionSetupActivity|JarvisAccessibilityService|JarvisNotificationListenerService" | head -80
