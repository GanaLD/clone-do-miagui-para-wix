plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mensagemstudio.jarvis'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mensagemstudio.jarvis'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.6.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
