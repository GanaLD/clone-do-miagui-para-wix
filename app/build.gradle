plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mensagemstudio.jarvis'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mensagemstudio.jarvis'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '1.12.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['onnx', 'txt']
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
}

tasks.register('prepareBundledJarvisVoice', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_bundled_jarvis_voice.py'
}

tasks.register('forceLocalJarvisVoice', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/use_local_jarvis_voice.py'
}

tasks.register('embedControlApk') {
    dependsOn ':control:assembleDebug'
    doLast {
        def sourceApk = file('../control/build/outputs/apk/debug/control-debug.apk')
        if (!sourceApk.exists()) {
            throw new GradleException('Control companion APK was not produced')
        }
        def assetsDir = file('src/main/assets')
        assetsDir.mkdirs()
        copy {
            from sourceApk
            into assetsDir
            rename { 'JARVIS-Control-v1.0-Android16.apk' }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareBundledJarvisVoice')
    dependsOn tasks.named('forceLocalJarvisVoice')
    dependsOn tasks.named('embedControlApk')
}
