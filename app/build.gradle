plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mensagemstudio.jarvis'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mensagemstudio.jarvis'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '1.9.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('embedControlApk') {
    dependsOn ':control:assembleDebug'
    doLast {
        def sourceApk = file('../control/build/outputs/apk/debug/control-debug.apk')
        if (!sourceApk.exists()) {
            throw new GradleException('Control companion APK was not produced')
        }
        def assetsDir = file('src/main/assets')
        assetsDir.mkdirs()
        copy {
            from sourceApk
            into assetsDir
            rename { 'JARVIS-Control-v1.0-Android16.apk' }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('embedControlApk')
}
